{% extends 'base.html' %}

{% block title %}Recipe list{% endblock %}

{% load static %}

{% block content %}

<h1>Recipe Book</h1>
{% for recipe in recipes %}
    <h2> <a href={{ recipe.link }}>{{ recipe.name }}</a> </h2>
    <ul>
        {% for i in recipe.ingredients %}
        <li>{{ i.name }} ( {{ i.quantity }} )</li>
    {% endfor %}
    </ul>
{% endfor %}

{% endblock %}
